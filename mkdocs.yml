site_name: "Moose Docs"
site_description : "Simulate diatomic spectra in python based on line-by-line databases."
site_author: Antoine Salden
site_url: https://antoinetue.github.io/Moose/
repo_name: AntoineTUE/Moose
repo_url: https://github.com/AntoineTUE/Moose
copyright: 'Copyright &copy; Antoine Salden 2024-present'

docs_dir: docs
site_dir: site
theme:
  name: materialx
  logo: assets/moose.svg
  favicon: assets/moose.svg
  custom_dir: docs/overrides
  features:
    - navigation.list
    - navigation.sections
    - navigation.footer
    - toc.integrate
    - toc.follow
    - content.code.copy
    - search.highlight
  topbar_style: accent 
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: green
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - codehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
      provider: github
      user: AntoineTUE
      repo: Moose


extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.min.js

plugins:
  search: {}
  autorefs: {}
  gh-admonitions: {}
  section-index: {}
  mike:
    alias_type: copy
    canonical_version: "latest"
    version_selector: true
  mkdocs-jupyter:
    # markdown_cell_processor: mkdocs
    include_requirejs: true
    include_source: true
    include: ["*.ipynb"]
    ignore: ["*/.ipynb_checkpoints/*.ipynb"]
  document-dates:
    position: bottom
    type: date
    show_author: false
  api-autonav:
    modules: ["src/Moose"]
    exclude_private: true
    nav_section_title: API Reference 
  mkdocstrings:
    default_handler: python_xref
    handlers:
      python_xref:
        inventories:
          - https://numpy.org/doc/stable/objects.inv
          - https://lmfit.github.io/lmfit-py/objects.inv
          - http://pandas.pydata.org/pandas-docs/stable/objects.inv
          - https://docs.scipy.org/doc/scipy/objects.inv
          - https://scikit-hep.org/iminuit/objects.inv
          - https://docs.python.org/3/objects.inv
        paths: 
          - src
        options:
          members_order: source
          relative_crossrefs: true
          signature_crossrefs: true
          heading_level: 2
          summary: true
          docstring_style: google
          docstring_options:
            ignore_init_summary: no
          merge_init_into_class: no
          show_submodules: no
          show_root_heading: true
          show_root_full_path: true
          show_root_members_full_path: false
          #Docstrings
          show_if_no_docstring: true
          show_docstring_attributes: true
          show_docstring_functions: true
          #Signatures/Annotations
          annotations_path: brief
          separate_signature: true
          line_length: 100
          show_signature_annotations: true
          # Other
          show_bases: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          extra:
            show_docstrings_modules: true

nav:
- index.md
- Getting started: get_started.md
# - Principles: Theory.md
- Citing: citing.md
- Examples:
  - examples.md
  - Fitting backends: examples/Moose_fitting_backends.ipynb
  - Interactive plotting:
    - Matplotlib: examples/matplotlib.ipynb
    - Bokeh: examples/bokeh.ipynb
    - Plotly: examples/plotly.ipynb
    - Iminuit: examples/iminuit.ipynb
  - Parallel fitting with Dask: examples/dask.ipynb
  - Spectra with multiple species: examples/Multiple_species.ipynb

watch:
- src/Moose

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/AntoineTUE/Moose
