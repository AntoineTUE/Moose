name: documentation
on:
  push:
    branches:
      - main
    tags-ignore:
      - v*
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy_docs_dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          python-version: '3.13'
          activate-environment: true
      - name: Install Hatch
        run: uv pip install --upgrade --system hatch
      - name: Deploy latest dev version docs
        run: hatch run docs:ci-build --push dev
      
