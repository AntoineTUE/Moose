name: test

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  run:
    name: Python ${{ matrix.python-version }} numpy=${{ matrix.numpy }} pandas=${{ matrix.pandas }}
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pandas: ["pandas-1.5", "pandas-2.x", "pandas-3.x"]
        numpy: ["numpy-1.26", "numpy-2.x"]
        # Exclude apparently only remove a single combinations, not lists
        exclude:
          # pandas 1.5 only with Python 3.10/3.11 + NumPy 1.26
          - pandas: "pandas-1.5"
            numpy: "numpy-2.x"
          - pandas: "pandas-1.5"
            python-version: "3.12"
          - pandas: "pandas-1.5"
            python-version: "3.13"
          - pandas: "pandas-1.5"
            python-version: "3.14"
          # pandas 2.x + NumPy 1.26 only up to Python 3.12
          - pandas: "pandas-2.x"
            numpy: "numpy-1.26"
            python-version: "3.13"
          - pandas: "pandas-2.x"
            numpy: "numpy-1.26"
            python-version: "3.14"
          # pandas 3.x only with Python 3.11+
          - pandas: "pandas-3.x"
            python-version: "3.10"
          # numpy-1.26 exluded on python 3.13+
          - numpy: "numpy-1.26"
            python-version: "3.13"
          - numpy: "numpy-1.26"
            python-version: "3.14"

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }} ${{ matrix.numpy }} ${{ matrix.pandas }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "latest"
        enable-cache: true
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Run tests
      run: uvx hatch test --python ${{ matrix.python-version }} -i numpy=${{ matrix.numpy }} -i pandas=${{ matrix.pandas }} --cover
