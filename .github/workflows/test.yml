name: test

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  run:
    name: Python ${{ matrix.python-version }} numpy=${{ matrix.numpy }} pandas=${{ matrix.pandas }}
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        python-version: ['3.10', '3.11','3.12','3.13', '3.14']
        numpy: ["numpy-1.26","numpy-2.x"]
        pandas: ["pandas-1.5","pandas-2.x","pandas-3.x"]
        exclude:
          - python-version: '3.10'
            pandas: 'pandas-3.x'
          - python-version: '3.12'
            pandas: 'pandas-1.5'
          - python-version: ['3.13','3.14']
            numpy: "numpy-1.26"
            pandas: 'pandas-1.5'

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }} ${{ matrix.numpy }} ${{ matrix.pandas }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: true
        python-version: ${{ matrix.python-version }}
        activate-environment: true

    - name: Install Hatch
      run: uv pip install --upgrade --system hatch

    - name: Run tests
      run: hatch test --python ${{ matrix.python-version }} -i numpy=${{ matrix.numpy }} -i pandas=${{ matrix.pandas }} --cover
